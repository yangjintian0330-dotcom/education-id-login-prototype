// Local interaction prototype. No credentials are sent or persisted.
(() => {
  const $ = id => document.getElementById(id);
  const card = document.querySelector('.edu-login');
  let mode = 'edu', educationId = '', countdown = 0, timer;
  const configuredIds = new Set();
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  function field(id, label, type = 'text', autocomplete = 'off') {
    return `<div class="edu-field"><label class="srOnly__jW4M" for="${id}">${label}</label><div class="inputShell_IIhEp"><input id="${id}" type="${type}" placeholder="${label}" autocomplete="${autocomplete}" maxlength="${type === 'password' ? 64 : 40}">${type === 'password' ? `<button type="button" class="edu-eye" data-input="${id}" aria-label="显示${label}" aria-pressed="false">${eye}</button>` : ''}</div></div>`;
  }
  function render(next) {
    mode = next;
    const reset = mode === 'reset', done = mode === 'done', forgot = mode === 'forgot';
    card.classList.toggle('is-reset', reset);
    card.classList.toggle('is-forgot', forgot);
    $('forgot').hidden = mode !== 'edu';
    $('message').style.color = ''; 
    $('back').hidden = !reset && !forgot;
    document.querySelector('.edu-tabs').hidden = reset || done || forgot;
    $('intro').hidden = !reset && !forgot;
    $('intro').textContent = forgot ? '完成账号安全验证后，可设置登录密码' : '首次使用账号密码登录，请设置新密码';
    $('agreement').hidden = reset || done || forgot;
    $('school-title').textContent = forgot ? '忘记密码' : reset ? '设置新密码' : done ? '登录成功' : '欢迎登录';
    $('submit').textContent = forgot ? '保存' : reset ? '设置密码并登录' : done ? '返回登录' : '登录';
    $('message').textContent = '';
    for (const name of ['phone', 'edu']) {
      $(name + '-tab').setAttribute('aria-selected', String(mode === name));
      $(name + '-tab').tabIndex = mode === name ? 0 : -1;
    }
    if (mode === 'phone' || mode === 'forgot') {
      $('fields').innerHTML = field('phone', '请输入手机号', 'tel', 'tel') + '<div class="edu-field"><label class="srOnly__jW4M" for="code">请输入验证码</label><div class="codeRow_niUER"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="请输入验证码"><button type="button" id="send" disabled>获取验证码</button></div></div>';
      if (forgot) {
        $('fields').insertAdjacentHTML('beforeend', '<p class="edu-hint">密码长度在8-20位，应包含数字、大写字母、小写字母、符号（除空格）的两种或以上</p>' + field('new-password', '请输入新密码', 'password', 'new-password') + field('confirm-password', '请再次输入新密码', 'password', 'new-password'));
        $('code').placeholder = '请输入6位验证码';
      }
      $('phone').maxLength = 11;
      $('send').onclick = () => {
        countdown = 60;
        $('message').textContent = '演示验证码：123456（未发送真实短信）';
        clearInterval(timer);
        timer = setInterval(() => { countdown--; if (countdown <= 0) clearInterval(timer); update(); }, 1000);
        update();
      };
    } else if (mode === 'edu') {
      $('fields').innerHTML = field('education-id', '请输入账号', 'text', 'username') + field('password', '请输入密码', 'password', 'current-password');
      $('education-id').value = educationId;
    } else if (reset) {
      $('fields').innerHTML = field('new-password', '请输入新密码', 'password', 'new-password') + field('confirm-password', '请再次输入新密码', 'password', 'new-password') + '<p class="edu-hint">密码长度在8-20位，应包含数字、大写字母、小写字母、符号（除空格）的两种或以上</p>';
    } else {
      $('fields').innerHTML = '<p class="edu-success">已完成登录流程<br><span style="color:#99988f;font-size:12px">当前为交互演示，未连接真实账号服务</span></p>';
    }
    update();
  }
  function update() {
    let ready = false;
    if (mode === 'phone' || mode === 'forgot') {
      const validPhone = /^1\d{10}$/.test($('phone').value);
      $('send').disabled = !validPhone || countdown > 0;
      $('send').style.color = $('send').disabled ? '#c8c7c2' : '#305c4e';
      $('send').textContent = countdown > 0 ? `${countdown} 秒后重试` : '获取验证码';
      ready = validPhone && /^\d{6}$/.test($('code').value) && (mode === 'forgot' ? !!$('new-password').value && !!$('confirm-password').value : $('consent').checked);
    } else if (mode === 'edu') ready = !!$('education-id').value.trim() && !!$('password').value && $('consent').checked;
    else if (mode === 'reset') ready = !!$('new-password').value && !!$('confirm-password').value;
    else ready = true;
    $('submit').disabled = !ready;
  }
  function switchTo(next) {
    if (mode === 'edu') educationId = $('education-id').value.trim();
    render(next);
  }
  for (const name of ['phone', 'edu']) {
    $(name + '-tab').onclick = () => switchTo(name);
    $(name + '-tab').onkeydown = event => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const target = event.key === 'Home' ? 'edu' : event.key === 'End' ? 'phone' : name === 'phone' ? 'edu' : 'phone';
        switchTo(target); $(target + '-tab').focus();
      }
    };
  }
  $('forgot').onclick = () => { educationId = $('education-id').value.trim(); render('forgot'); $('phone').focus(); };
  $('back').onclick = () => { render('edu'); $('edu-tab').focus(); };
  $('login-form').addEventListener('input', () => { $('message').textContent = ''; update(); });
  $('fields').addEventListener('click', event => {
    const toggle = event.target.closest('[data-input]');
    if (!toggle) return;
    const input = $(toggle.dataset.input), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', (show ? '隐藏' : '显示') + input.placeholder);
  });
  $('login-form').onsubmit = event => {
    event.preventDefault();
    if ($('submit').disabled) return;
    if (mode === 'edu') {
      educationId = $('education-id').value.trim();
      render(configuredIds.has(educationId) ? 'done' : 'reset');
      if (mode === 'reset') $('new-password').focus();
    } else if (mode === 'reset' || mode === 'forgot') {
      if (mode === 'forgot' && $('code').value !== '123456') { $('message').textContent = '验证码错误，演示验证码为 123456。'; $('code').focus(); return; }
      const password = $('new-password').value;
      const categories = [/\d/, /[A-Z]/, /[a-z]/, /[^A-Za-z0-9\s]/].filter(pattern => pattern.test(password)).length;
      if (!/^[\x21-\x7e]{8,20}$/.test(password) || categories < 2) {
        $('message').textContent = '密码需为 8–20 位，且包含上述至少两种字符，不含空格。';
        $('new-password').focus(); return;
      }
      if (password !== $('confirm-password').value) {
        $('message').textContent = '两次输入的密码不一致，请重新输入。';
        $('confirm-password').focus(); return;
      }
      if (educationId) configuredIds.add(educationId);
      if (mode === 'forgot') {
        render('edu');
        $('message').textContent = '密码已保存，请使用新密码登录（演示）。';
        $('message').style.color = '#305c4e';
      } else render('done');
    } else if (mode === 'phone' || mode === 'forgot') {
      if ($('code').value !== '123456') { $('message').textContent = '验证码错误，演示验证码为 123456。'; return; }
      render('done');
    } else { $('consent').checked = false; render('edu'); }
  };
  render('edu');
})();

</script></body></html>
