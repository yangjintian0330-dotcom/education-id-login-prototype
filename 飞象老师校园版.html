    $('intro').textContent = forgot ? '完成账号安全验证后，可设置登录密码' : '首次使用账号密码登录，请设置新密码';
    $('agreement').hidden = reset || done || forgot;
    $('school-title').textContent = forgot ? '忘记密码' : reset ? '设置新密码' : done ? '登录成功' : '欢迎登录';
    $('submit').textContent = forgot ? '保存' : reset ? '设置密码并登录' : done ? '返回登录' : '登录';
    $('login-form').setAttribute('data-sec', forgot ? '5' : reset ? '4' : mode === 'edu' ? '3' : '2');
    $('submit').setAttribute('data-track', forgot ? '/click/teacherLoginPage/saveResetPassword | 保存重置密码 | 无' : reset ? '/click/teacherLoginPage/saveFirstPassword | 保存首次登录密码 | 无' : mode === 'edu' ? '/click/teacherLoginPage/accountLogin | 提交账号密码登录 | 无' : '/click/teacherLoginPage/phoneLogin | 提交手机号验证码登录 | 无');
    $('message').textContent = '';
    for (const name of ['phone', 'edu']) {
      $(name + '-tab').setAttribute('aria-selected', String(mode === name));
      $(name + '-tab').tabIndex = mode === name ? 0 : -1;
    }
    if (mode === 'phone' || mode === 'forgot') {
      $('fields').innerHTML = field('phone', '请输入手机号', 'tel', 'tel') + '<div class="edu-field"><label class="srOnly__jW4M" for="code">请输入验证码</label><div class="codeRow_niUER"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="请输入验证码"><button type="button" id="send" disabled>获取验证码</button></div></div>';
      if (forgot) {
        $('fields').insertAdjacentHTML('beforeend', '<p class="edu-hint">密码长度在8-20位，应包含数字、大写字母、小写字母、符号（除空格）的两种或以上</p>' + field('new-password', '请输入新密码', 'password', 'new-password') + field('confirm-password', '请再次输入新密码', 'password', 'new-password'));
        $('code').placeholder = '请输入6位验证码';
      }
      $('phone').maxLength = 11;
      $('send').onclick = () => {
        countdown = 60;
        $('message').textContent = '演示验证码：123456（未发送真实短信）';
        clearInterval(timer);
        timer = setInterval(() => { countdown--; if (countdown <= 0) clearInterval(timer); update(); }, 1000);
        update();
      };
      $('send').setAttribute('data-track', forgot ? '/click/teacherLoginPage/sendResetCode | 获取找回密码验证码 | 无' : '/click/teacherLoginPage/sendLoginCode | 获取登录验证码 | 无');
    } else if (mode === 'edu') {
      $('fields').innerHTML = field('education-id', '请输入手机号或账号', 'text', 'username') + field('password', '请输入密码', 'password', 'current-password');
      $('education-id').value = educationId;
    } else if (reset) {
      $('fields').innerHTML = field('new-password', '请输入新密码', 'password', 'new-password') + field('confirm-password', '请再次输入新密码', 'password', 'new-password') + '<p class="edu-hint">密码长度在8-20位，应包含数字、大写字母、小写字母、符号（除空格）的两种或以上</p>';
    } else {
      $('fields').innerHTML = '<p class="edu-success">已完成登录流程<br><span style="color:#99988f;font-size:12px">当前为交互演示，未连接真实账号服务</span></p>';
    }
    if (typeof collectSections === 'function' && document.getElementById('reviewPanel')?.classList.contains('open')) {
      collectSections(); renderMarkers();
    }
    update();
  }
  function update() {
    let ready = false;
    if (mode === 'phone' || mode === 'forgot') {
      const validPhone = /^1\d{10}$/.test($('phone').value);
      $('send').disabled = !validPhone || countdown > 0;
      $('send').style.color = $('send').disabled ? '#c8c7c2' : '#305c4e';
      $('send').textContent = countdown > 0 ? `${countdown} 秒后重试` : '获取验证码';
      ready = validPhone && /^\d{6}$/.test($('code').value) && (mode === 'forgot' ? !!$('new-password').value && !!$('confirm-password').value : $('consent').checked);
    } else if (mode === 'edu') ready = !!$('education-id').value.trim() && !!$('password').value && $('consent').checked;
    else if (mode === 'reset') ready = !!$('new-password').value && !!$('confirm-password').value;
    else ready = true;
    $('submit').disabled = !ready;
  }
  function clearFormFeedback() {
    $('message').textContent = '';
    $('message').className = 'edu-message';
    card.querySelectorAll('.has-error').forEach(element => element.classList.remove('has-error'));
  }
  function showFormError(message, inputIds = []) {
    clearFormFeedback();
    $('message').textContent = message;
    $('message').className = 'edu-message is-error';
    inputIds.forEach(id => {
      const input = $(id);
      const shell = input?.closest('.inputShell_IIhEp, .codeRow_niUER');
      if (shell) shell.classList.add('has-error');
    });
  }
  function switchTo(next) {
    if (mode === 'edu') educationId = $('education-id').value.trim();
    render(next);
  }
  for (const name of ['phone', 'edu']) {
    $(name + '-tab').onclick = () => switchTo(name);
    $(name + '-tab').onkeydown = event => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const target = event.key === 'Home' ? 'phone' : event.key === 'End' ? 'edu' : name === 'phone' ? 'edu' : 'phone';
        switchTo(target); $(target + '-tab').focus();
      }
    };
  }
  $('forgot').setAttribute('data-track', '/click/teacherLoginPage/forgotPassword | 点击忘记密码 | 无');
  $('forgot').onclick = () => { educationId = $('education-id').value.trim(); render('forgot'); $('phone').focus(); };
  $('back').onclick = () => { render('edu'); $('edu-tab').focus(); };
  $('login-form').addEventListener('input', () => { clearFormFeedback(); update(); });
  $('fields').addEventListener('click', event => {
    const toggle = event.target.closest('[data-input]');
    if (!toggle) return;
    const input = $(toggle.dataset.input), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', (show ? '隐藏' : '显示') + input.placeholder);
  });
  $('login-form').onsubmit = event => {
    event.preventDefault();
    if ($('submit').disabled) return;
    if (mode === 'edu') {
      educationId = $('education-id').value.trim();
      if (!validLoginIds.has(educationId) || $('password').value !== currentPassword) {
        showFormError('手机号或密码不正确', ['education-id', 'password']);
        $('password').focus(); return;
      }
      render(needsPasswordReset ? 'reset' : 'done');
      if (mode === 'reset') $('new-password').focus();
    } else if (mode === 'reset' || mode === 'forgot') {
      if (mode === 'forgot' && $('code').value !== '123456') { showFormError('验证码错误，演示验证码为 123456。', ['code']); $('code').focus(); return; }
      const password = $('new-password').value;
      const categories = [/\d/, /[A-Z]/, /[a-z]/, /[^A-Za-z0-9\s]/].filter(pattern => pattern.test(password)).length;
      if (!/^[\x21-\x7e]{8,20}$/.test(password) || categories < 2) {
        showFormError('密码格式不正确，请按上方规则重新设置', ['new-password']);
        $('new-password').focus(); return;
      }
      if (password !== $('confirm-password').value) {
        showFormError('两次输入的密码不一致，请重新输入。', ['confirm-password']);
        $('confirm-password').focus(); return;
      }
      currentPassword = password;
      needsPasswordReset = false;
      if (mode === 'forgot') {
        render('edu');
        $('message').textContent = '密码已保存，请使用新密码登录（演示）。';
        $('message').className = 'edu-message is-success';
      } else render('done');
    } else if (mode === 'phone' || mode === 'forgot') {
      if ($('code').value !== '123456') { $('message').textContent = '验证码错误，演示验证码为 123456。'; return; }
      render('done');
    } else { $('consent').checked = false; render('phone'); }
  };
  render('phone');
})();

</script>

# 飞象老师校园版登录页
> v1.5 · Web 桌面端 · 2026-09-23

## 1. 登录方式切换
展示：手机号验证码登录、账号密码登录两种方式。

规则：
- 默认选中「手机号验证码登录」，并排在「账号密码登录」之前
- 切换登录方式后，展示对应表单；用户协议勾选状态保留
- 从账号密码登录切走再返回时，保留已输入的账号；密码不保留

异常：
- 登录方式加载失败 → 默认展示手机号验证码登录

## 2. 手机号验证码登录 [UPDATED]
[~] 页面展示、交互、校验、异常处理及登录成功后的跳转均同线上现有逻辑。

## 3. 账号密码登录 [UPDATED]
展示：手机号或账号、密码、密码显隐按钮、「忘记密码」、登录按钮。

演示数据：
- 正确账号：`teacher001`
- 正确手机号：`13800000000`
- 初始密码：`Fx123456!`
- 账号或手机号搭配初始密码均可通过校验，并在首次登录时进入「设置新密码」

交互：
- 输入手机号或账号和密码；两项均非空且同意用户协议后，登录按钮可点击
- 点击密码显隐按钮 → 在明文与密文之间切换
- 点击登录后校验账号状态和密码
- 首次登录且账号密码正确 → 进入「设置新密码」
- 非首次登录且账号密码正确 → 按线上现有逻辑完成登录并跳转
- 点击「忘记密码」→ 进入手机号安全验证与密码重置流程

规则：
- 手机号或账号前后空格不计入有效内容
- 密码默认隐藏
- 切换到其他登录方式后，已输入账号保留，密码清空
- 账号或密码错误时使用统一提示，不区分账号是否存在
- 账号、手机号或密码不匹配时，在表单内显示红字提示；账号和密码输入框同步显示红色边框及浅红背景
- 错误提示字号为 13px、颜色为 `#D14343`，输入框背景为 `#FFF9F8`；用户修改任一输入内容后清除错误态
- 登录接口异常也使用表单内红字提示，不使用 Toast

异常：
- 手机号或账号为空 →「请输入手机号或账号」
- 密码为空 →「请输入密码」
- 手机号、账号或密码错误 →「手机号或密码不正确」
- 账号已停用 →「当前账号已停用，请联系管理员」
- 登录失败 →「登录失败，请稍后重试」

## 4. 首次登录设置新密码
展示：新密码、再次输入新密码、密码规则、密码显隐按钮、「设置密码并登录」、返回登录。

交互：
- 首次账号密码校验通过后进入本页
- 点击「返回登录」→ 返回账号密码登录，可重新选择登录方式
- 两次密码输入有效且一致后，可设置密码并继续登录

规则：
- 密码长度 8–20 位，不可包含空格
- 数字、大写字母、小写字母、符号四类字符中至少包含两类
- 两次输入必须一致
- 密码规则使用灰色常驻说明；校验失败时只补充一行红色结果提示，避免重复展示整条规则
- 红色提示区固定为单行高度，与「设置密码并登录」按钮保持间距，不遮挡按钮

异常：
- 新密码不符合规则 →「密码格式不正确，请按上方规则重新设置」
- 两次密码不一致 →「两次输入的密码不一致，请重新输入」
- 新密码与初始密码相同 →「新密码不能与初始密码相同」
- 保存失败 →「密码设置失败，请稍后重试」

## 5. 忘记密码
展示：手机号、验证码、「获取验证码」、新密码、再次输入新密码、密码规则、保存按钮、返回登录。

交互：
- 从账号密码登录点击「忘记密码」进入本页
- 完成手机号验证并输入两次一致的新密码后，保存按钮可点击
- 保存成功 → 返回账号密码登录，并提示「密码已保存，请使用新密码登录」
- 点击「返回登录」→ 返回账号密码登录

规则：
- 手机号须为账号绑定手机号
- 验证码和密码规则分别沿用手机号验证及密码设置规则

异常：
- 手机号未绑定账号 →「该手机号未绑定账号，请联系管理员」
- 验证码错误 →「验证码错误，请重新输入」
- 验证码过期 →「验证码已过期，请重新获取」
- 密码不符合规则或两次输入不一致 → 使用首次设置新密码的对应提示
- 保存失败 →「密码保存失败，请稍后重试」

## 6. 用户协议与隐私政策
展示：协议勾选框、《用户协议》《隐私政策》链接。

交互：
- 点击协议名称 → 新窗口打开对应协议正文
- 勾选协议后，满足当前登录方式的其他条件时登录按钮可点击

规则：
- 默认未勾选
- 手机号验证码登录和账号密码登录均须同意协议
- 首次设置密码、忘记密码页面不重复展示协议

异常：
- 协议正文打开失败 → 保留当前登录页，并提示「页面加载失败，请稍后重试」

<script>
var PRD_MD=(document.getElementById('prdSrc')||{textContent:''}).textContent.trim();
var PRD_KEY='prd:'+document.title+':v1.5';
function rpInline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function renderMd(md){
  var inList=false,out=[];
  function flushList(){if(inList){out.push('</ul>');inList=false;}}
  md.split('\n').forEach(function(line){
    if(/^#\s/.test(line)){flushList();out.push('<h1>'+rpInline(line.replace(/^#\s+/,''))+'</h1>');return;}
    if(/^##\s/.test(line)){flushList();var t=line.replace(/^##\s+/,''),badge='';if(/\s*\[UPDATED\]\s*$/i.test(t)){badge=' <span class="rp-badge updated">UPDATED</span>';t=t.replace(/\s*\[UPDATED\]\s*$/i,'');}var n=t.match(/^(\d+)[.．]/);out.push('<h2'+(n?' id="rp-sec-'+n[1]+'"':'')+'>'+rpInline(t)+badge+'</h2>');return;}
    if(/^###\s/.test(line)){flushList();out.push('<h3>'+rpInline(line.replace(/^###\s+/,''))+'</h3>');return;}
    if(/^>\s+/.test(line)){flushList();out.push('<blockquote>'+rpInline(line.replace(/^>\s+/,''))+'</blockquote>');return;}
    if(/^\[!\]\s+/.test(line)){flushList();out.push('<div class="prd-note">'+rpInline(line.replace(/^\[!\]\s+/,''))+'</div>');return;}
    if(/^\[~\]\s+/.test(line)){flushList();out.push('<div class="rp-diff change">'+rpInline(line.replace(/^\[~\]\s+/,''))+'</div>');return;}
    if(/^[-*]\s/.test(line)){if(!inList){out.push('<ul>');inList=true;}out.push('<li>'+rpInline(line.replace(/^[-*]\s+/,''))+'</li>');return;}
    flushList();if(line.trim())out.push('<p>'+rpInline(line)+'</p>');
  });
  flushList();return out.join('\n');
}
function currentPrd(){try{return localStorage.getItem(PRD_KEY)||PRD_MD;}catch(e){return PRD_MD;}}
function renderEditBar(editing){
  var bar=document.getElementById('rpEditBar'),edited=false;

  if(!editing)bar.innerHTML='<button type="button" onclick="startPrdEdit()">✏️ 编辑</button>'+(edited?'<span class="rp-edited">已本地编辑</span><button type="button" onclick="resetPrd()">恢复默认</button>':'');
  else bar.innerHTML='<button class="primary" type="button" onclick="savePrd()">保存</button><button type="button" onclick="cancelPrdEdit()">取消</button><button type="button" onclick="copyPrd()">复制 Markdown</button><span class="rp-hint">修改仅保存在本浏览器；全员可见需写回源码并重新发布</span>';
}
function renderPrd(){
  document.getElementById('rpDocContent').innerHTML=renderMd(currentPrd());renderEditBar(false);
  document.querySelectorAll('#rpDocContent h2[id^="rp-sec-"]').forEach(function(h){h.style.cursor='pointer';h.onclick=function(){var n=h.id.replace('rp-sec-',''),s=_sections.find(function(x){return x.sec===n;});if(!s)return;_activeSec=n;renderMarkers();s.el.scrollIntoView({behavior:'smooth',block:'center'});};});
}
function startPrdEdit(){var ta=document.getElementById('rpEditArea');ta.value=currentPrd();ta.style.display='block';document.getElementById('rpDocContent').style.display='none';renderEditBar(true);}
function cancelPrdEdit(){document.getElementById('rpEditArea').style.display='none';document.getElementById('rpDocContent').style.display='block';renderEditBar(false);}
function savePrd(){try{localStorage.setItem(PRD_KEY,document.getElementById('rpEditArea').value);}catch(e){}cancelPrdEdit();renderPrd();}
function resetPrd(){try{localStorage.removeItem(PRD_KEY);}catch(e){}renderPrd();}
function copyPrd(){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById('rpEditArea').value);}
var _sections=[],_activeSec='';
function collectSections(){_sections=[];document.querySelectorAll('[data-sec]').forEach(function(el){if(!el.hidden)_sections.push({el:el,sec:el.getAttribute('data-sec')});});}
function renderMarkers(){
  var layer=document.getElementById('rpMarkers');if(!layer)return;layer.innerHTML='';
  _sections.forEach(function(a){var r=a.el.getBoundingClientRect();if(!r.width&&!r.height)return;if(a.sec===_activeSec){var hl=document.createElement('div');hl.className='rp-hl';hl.style.left=r.left+'px';hl.style.top=r.top+'px';hl.style.width=r.width+'px';hl.style.height=r.height+'px';layer.appendChild(hl);}var m=document.createElement('div');m.className='rp-marker';m.textContent=a.sec;m.style.left=r.left+'px';m.style.top=r.top+'px';m.onclick=function(){focusSection(a.sec);};layer.appendChild(m);});

function focusSection(sec){if(document.getElementById('rpEditArea').style.display==='block')cancelPrdEdit();_activeSec=sec;renderMarkers();var h=document.getElementById('rp-sec-'+sec);if(h){h.scrollIntoView({behavior:'smooth',block:'start'});h.classList.add('rp-sec-flash');setTimeout(function(){h.classList.remove('rp-sec-flash');},1600);}}
function refreshMarkers(){if(document.getElementById('reviewPanel').classList.contains('open')){collectSections();renderMarkers();}}
window.addEventListener('scroll',refreshMarkers,true);window.addEventListener('resize',refreshMarkers);
function setReviewMode(mode){var open=mode==='review';document.getElementById('reviewPanel').classList.toggle('open',open);document.querySelectorAll('#modeToggle button').forEach(function(b,i){b.classList.toggle('active',open?i===1:i===0);});if(open){renderPrd();collectSections();renderMarkers();}else{_activeSec='';document.getElementById('rpMarkers').innerHTML='';}}
(function(){var p=document.getElementById('reviewPanel'),h=document.getElementById('rpHeader'),drag=false,ox,oy,sx,sy;h.addEventListener('mousedown',function(e){if(e.target.closest('.rp-close'))return;drag=true;ox=e.clientX;oy=e.clientY;sx=p.offsetLeft;sy=p.offsetTop;e.preventDefault();});document.addEventListener('mousemove',function(e){if(!drag)return;p.style.left=Math.max(0,Math.min(sx+e.clientX-ox,innerWidth-80))+'px';p.style.top=Math.max(0,Math.min(sy+e.clientY-oy,innerHeight-40))+'px';p.style.right='auto';});document.addEventListener('mouseup',function(){drag=false;});})();
(function(){var t=document.getElementById('modeToggle'),moved=false;t.addEventListener('mousedown',function(e){var ox=e.clientX,oy=e.clientY,r=t.getBoundingClientRect(),sl=r.left,st=r.top;moved=false;function mv(ev){if(!moved&&Math.abs(ev.clientX-ox)+Math.abs(ev.clientY-oy)>4){moved=true;t.classList.add('is-dragging');}if(!moved)return;t.style.left=Math.max(0,Math.min(sl+ev.clientX-ox,innerWidth-t.offsetWidth))+'px';t.style.top=Math.max(0,Math.min(st+ev.clientY-oy,innerHeight-t.offsetHeight))+'px';t.style.right='auto';}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);t.classList.remove('is-dragging');}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});t.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);})();
if(new URLSearchParams(location.search).get('mode')==='review')setReviewMode('review');
</script>
</body></html>
