# 智学教师版登录页
> v1.2 · Web 桌面端 · 2026-09-24

## 0. 产品登录页切换
展示：页面顶部固定展示「飞象老师 / Zhixue」分段切换器，当前页面高亮「Zhixue」。

交互：
- 点击「飞象老师」进入同项目的飞象老师校园版登录页
- 在登录、首次设置新密码和忘记密码页面均固定展示
- 当前处于过稿模式时，切换产品后继续保持过稿模式

## 1. 登录方式切换
展示：验证码登录、密码登录、扫码登录，默认选中验证码登录。

规则：
- 切换登录方式后展示对应表单，协议勾选状态保留
- 从密码登录切走再返回时，保留已输入的手机号或账号，密码不保留
- 验证码登录和扫码登录的展示、交互、校验、异常处理及成功跳转均同线上现有逻辑

异常：登录方式加载失败时，默认展示验证码登录。

## 2. 密码登录 [UPDATED]
展示：手机号或账号、密码、密码显隐按钮、「忘记密码」、登录按钮。

演示数据：
- 正确账号：`teacher001`
- 正确手机号：`13800000000`
- 初始密码：`Fx123456!`
- 账号或手机号搭配初始密码均可通过校验，并在首次登录时进入「设置新密码」

交互：
- 输入手机号或账号和密码；两项均非空且同意协议后，登录按钮可点击
- 点击密码显隐按钮 → 在明文与密文之间切换
- 点击登录后校验账号状态和密码
- 首次登录且账号密码正确 → 进入「设置新密码」
- 非首次登录且账号密码正确 → 进入智学教师端 `https://laoshi.feixiangxingqiu.com/`
- 点击「忘记密码」→ 进入手机号安全验证与密码重置流程

规则：
- 手机号或账号前后空格不计入有效内容
- 密码默认隐藏
- 切换到其他登录方式后，已输入账号保留，密码清空
- 账号或密码错误时使用统一提示，不区分账号是否存在
- 账号、手机号或密码不匹配时，账号和密码输入框显示红色边框及浅红背景
- 错误提示字号为 13px、颜色为 `#D14343`，输入框背景为 `#FFF9F8`
- 用户修改任一输入内容后清除错误态
- 登录接口异常使用表单内红字提示，不使用 Toast

异常：
- 手机号或账号为空 →「请输入手机号或账号」
- 密码为空 →「请输入密码」
- 手机号、账号或密码错误 →「手机号或密码不正确」
- 账号已停用 →「当前账号已停用，请联系管理员」
- 登录失败 →「登录失败，请稍后重试」

## 3. 首次登录设置新密码
展示：新密码、再次输入新密码、密码规则、密码显隐按钮、「设置密码并登录」、返回登录。

交互：
- 首次账号密码校验通过后进入本页
- 点击「返回登录」→ 返回密码登录，可重新选择登录方式
- 两次密码输入有效且一致后，保存新密码并进入智学教师端
- 跳转地址：`https://laoshi.feixiangxingqiu.com/`

规则：
- 密码长度在 8–20 位，不可包含空格
- 数字、大写字母、小写字母、符号四类字符中至少包含两类
- 两次输入必须一致
- 密码规则使用灰色常驻说明；校验失败时只补充一行红色结果提示，避免重复展示整条规则
- 红色提示区固定为单行高度，与「设置密码并登录」按钮保持间距，不遮挡按钮

异常：
- 新密码不符合规则 →「密码格式不正确，请按上方规则重新设置」
- 两次密码不一致 →「两次输入的密码不一致，请重新输入」
- 保存失败 →「密码设置失败，请稍后重试」

## 4. 忘记密码
展示：手机号、验证码、「获取验证码」、新密码、再次输入新密码、密码规则、保存按钮、返回登录。

交互：
- 从密码登录点击「忘记密码」进入本页
- 完成手机号验证并输入两次一致的新密码后，保存按钮可点击
- 保存成功 → 直接返回密码登录，不展示成功提示
- 点击「返回登录」→ 返回密码登录

规则：
- 手机号须为账号绑定手机号
- 验证码和密码规则分别沿用验证码登录及密码设置规则

异常：
- 手机号未绑定账号 →「该手机号未绑定账号，请联系管理员」
- 验证码错误 →「验证码错误，请重新输入」
- 验证码过期 →「验证码已过期，请重新获取」
- 密码不符合规则或两次输入不一致 → 使用首次设置新密码的对应提示
- 保存失败 →「密码保存失败，请稍后重试」

## 5. 用户协议与隐私政策
展示：协议勾选框、《用户协议》《隐私政策》《儿童隐私保护政策》链接。

交互：
- 点击协议名称 → 新窗口打开对应协议正文
- 勾选协议后，满足当前登录方式的其他条件时登录按钮可点击

规则：
- 默认未勾选
- 验证码登录、密码登录和扫码登录均须同意协议
- 首次设置密码、忘记密码页面不重复展示协议

异常：协议正文打开失败时，保留当前登录页，并提示「页面加载失败，请稍后重试」。
</script>

  const card = $('login-card');
  const validLoginIds = new Set(['teacher001', '13800000000']);
  const homeUrl = 'https://laoshi.feixiangxingqiu.com/';
  const passwordRule = '密码长度在8-20位，应包含数字、大写字母、小写字母、符号（除空格）的两种或以上';
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  let mode = 'code', account = '', currentPassword = 'Fx123456!', needsPasswordReset = true, countdown = 0, timer;

  function field(id, label, type = 'text', autocomplete = 'off') {
    return `<div class="zx-field"><label class="sr-only" for="${id}">${label}</label><div class="zx-input-shell"><input id="${id}" type="${type}" placeholder="${label}" autocomplete="${autocomplete}" maxlength="${type === 'password' ? 64 : 40}">${type === 'password' ? `<button class="zx-eye" type="button" data-eye="${id}" aria-label="显示${label}" aria-pressed="false">${eye}</button>` : ''}</div></div>`;
  }
  function codeField() {
    return '<div class="zx-field"><label class="sr-only" for="code">请输入验证码</label><div class="zx-code-row"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="请输入验证码"><button id="send" type="button" disabled>获取验证码</button></div></div>';
  }
  function clearFeedback() {
    $('message').textContent = '';
    card.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));
  }
  function showError(text, ids = []) {
    clearFeedback();
    $('message').textContent = text;
    ids.forEach(id => $(id)?.closest('.zx-input-shell,.zx-code-row')?.classList.add('has-error'));
  }
  function setTabs() {
    for (const name of ['code','password','qr']) {
      $(name + '-tab').setAttribute('aria-selected', String(mode === name));
      $(name + '-tab').tabIndex = mode === name ? 0 : -1;
    }
  }
  function render(next) {
    if (mode === 'password' && $('account')) account = $('account').value.trim();
    mode = next;
    const flow = mode === 'reset' || mode === 'forgot';
    card.classList.toggle('is-flow', flow);
    card.classList.toggle('is-forgot', mode === 'forgot');
    $('tabs').hidden = flow;
    $('back').hidden = !flow;
    $('page-title').hidden = !flow;
    $('intro').hidden = !flow;
    $('agreement').hidden = flow;
    $('forgot').hidden = mode !== 'password';
    $('submit').hidden = mode === 'qr';
    $('message').textContent = '';
    if (!flow) $('page-title').textContent = '欢迎登录';
    if (mode === 'code') {
      $('fields').innerHTML = field('phone','请输入手机号','tel','tel') + codeField();
      $('submit').textContent = '登录';
      $('phone').maxLength = 11;
      bindSend();
    } else if (mode === 'password') {
      $('fields').innerHTML = field('account','请输入手机号或账号','text','username') + field('password','请输入密码','password','current-password');
      $('account').value = account;
      $('submit').textContent = '登录';
    } else if (mode === 'qr') {
      $('fields').innerHTML = '<div class="zx-qr"><div class="zx-qr-box"><span>扫码登录</span></div><p>请使用飞象星球 App 扫码登录</p></div>';
    } else if (mode === 'reset') {
      $('page-title').textContent = '设置新密码';
      $('intro').textContent = '首次使用账号密码登录，请设置新密码';
      $('fields').innerHTML = field('new-password','请输入新密码','password','new-password') + field('confirm-password','请再次输入新密码','password','new-password') + `<p class="zx-rule">${passwordRule}</p>`;
      $('submit').textContent = '设置密码并登录';
    } else if (mode === 'forgot') {
      $('page-title').textContent = '忘记密码';
      $('intro').textContent = '完成账号安全验证后，可设置登录密码';
      $('fields').innerHTML = field('phone','请输入手机号','tel','tel') + codeField() + field('new-password','请输入新密码','password','new-password') + field('confirm-password','请再次输入新密码','password','new-password') + `<p class="zx-rule">${passwordRule}</p>`;
      $('submit').textContent = '保存';
      $('phone').maxLength = 11;
      bindSend();
    }
    setTabs();
    update();
  }
  function bindSend() {
    $('send').onclick = () => {
      countdown = 60;
      $('message').textContent = '演示验证码：123456（未发送真实短信）';
      clearInterval(timer);
      timer = setInterval(() => { countdown -= 1; if (countdown <= 0) clearInterval(timer); update(); }, 1000);
      update();
    };
  }
  function update() {
    let ready = false;
    if (mode === 'code' || mode === 'forgot') {
      const phoneOk = /^1\d{10}$/.test($('phone').value);
      $('send').disabled = !phoneOk || countdown > 0;
      $('send').textContent = countdown > 0 ? `${countdown} 秒后重试` : '获取验证码';
      ready = phoneOk && /^\d{6}$/.test($('code').value) && (mode === 'forgot' ? !!$('new-password').value && !!$('confirm-password').value : $('consent').checked);
    } else if (mode === 'password') {
      ready = !!$('account').value.trim() && !!$('password').value && $('consent').checked;
    } else if (mode === 'reset') {
      ready = !!$('new-password').value && !!$('confirm-password').value;
    }
    if (!$('submit').hidden) $('submit').disabled = !ready;
  }
  function validPassword(value) {
    const categories = [/\d/,/[A-Z]/,/[a-z]/,/[^A-Za-z0-9\s]/].filter(pattern => pattern.test(value)).length;
    return /^[\x21-\x7e]{8,20}$/.test(value) && categories >= 2;
  }
  for (const name of ['code','password','qr']) {
    $(name + '-tab').onclick = () => render(name);
  }
  $('back').onclick = () => { render('password'); $('password-tab').focus(); };
  $('forgot').onclick = () => { account = $('account').value.trim(); render('forgot'); $('phone').focus(); };
  $('login-form').addEventListener('input', () => { clearFeedback(); update(); });
  $('fields').addEventListener('click', event => {
    const button = event.target.closest('[data-eye]');
    if (!button) return;
    const input = $(button.dataset.eye), reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    button.setAttribute('aria-pressed', String(reveal));
    button.setAttribute('aria-label', (reveal ? '隐藏' : '显示') + input.placeholder);
  });
  $('login-form').onsubmit = event => {
    event.preventDefault();
    if ($('submit').disabled) return;
    if (mode === 'password') {
      account = $('account').value.trim();
      if (!validLoginIds.has(account) || $('password').value !== currentPassword) {
        showError('手机号或密码不正确', ['account','password']);
        $('password').focus();
        return;
      }
      if (needsPasswordReset) { render('reset'); $('new-password').focus(); }
      else window.location.assign(homeUrl);
    } else if (mode === 'reset' || mode === 'forgot') {
      if (mode === 'forgot' && $('code').value !== '123456') {
        showError('验证码错误，请重新输入', ['code']); $('code').focus(); return;
      }
      const password = $('new-password').value;
      if (!validPassword(password)) {
        showError('密码格式不正确，请按上方规则重新设置', ['new-password']); $('new-password').focus(); return;
      }
      if (password !== $('confirm-password').value) {
        showError('两次输入的密码不一致，请重新输入', ['confirm-password']); $('confirm-password').focus(); return;
      }
      currentPassword = password;
      needsPasswordReset = false;
      if (mode === 'forgot') render('password');
      else window.location.assign(homeUrl);
    } else if (mode === 'code') {
      if ($('code').value !== '123456') { showError('验证码错误，请重新输入', ['code']); return; }
      window.location.assign(homeUrl);
    }
  };

  const defaultPrd = $('prd-source').textContent.trim();
  const prdStorageKey = 'zhixue-prd-draft-v1.2';
  function currentPrd() {
    try { return localStorage.getItem(prdStorageKey) || defaultPrd; }
    catch (error) { return defaultPrd; }
  }
  function hasPrdDraft() { return currentPrd() !== defaultPrd; }
  function inline(text) { return text.replace(/`([^`]+)`/g,'<code>$1</code>'); }
  function renderPrdToolbar(editing = false) {
    $('review-editbar').innerHTML = editing
      ? '<button class="primary" type="button" data-prd-action="save">保存修改</button><button type="button" data-prd-action="cancel">取消</button><button type="button" data-prd-action="copy">复制 Markdown</button><span class="hint">修改仅保存在当前浏览器</span>'
      : `<button class="primary" type="button" data-prd-action="edit">✎ 编辑</button>${hasPrdDraft() ? '<span class="edited">已本地编辑</span><button type="button" data-prd-action="reset">恢复默认</button>' : ''}<span class="hint">本地草稿</span>`;
  }
  function renderPrd() {
    const md = currentPrd();
    let list = false, html = '';
    const closeList = () => { if (list) { html += '</ul>'; list = false; } };
    md.split('\n').forEach(line => {
      if (/^#\s/.test(line)) { closeList(); html += `<h1>${inline(line.replace(/^#\s+/,''))}</h1>`; }
      else if (/^##\s/.test(line)) { closeList(); html += `<h2>${inline(line.replace(/^##\s+/,''))}</h2>`; }
      else if (/^>\s/.test(line)) { closeList(); html += `<blockquote>${inline(line.replace(/^>\s+/,''))}</blockquote>`; }
      else if (/^-\s/.test(line)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(line.replace(/^-\s+/,''))}</li>`; }
      else if (line.trim()) { closeList(); html += `<p>${inline(line)}</p>`; }
      else closeList();
    });
    closeList(); $('review-body').innerHTML = html;
    renderPrdToolbar(false);
  }
  function editPrd() {
    $('review-editor').value = currentPrd();
    $('review-body').hidden = true;
    $('review-editor').hidden = false;
    renderPrdToolbar(true);
    $('review-editor').focus();
  }
  function cancelPrdEdit() {
    $('review-editor').hidden = true;
    $('review-body').hidden = false;
    renderPrdToolbar(false);
  }
  function savePrd() {
    const next = $('review-editor').value.trim();
    try {
      if (next === defaultPrd) localStorage.removeItem(prdStorageKey);
      else localStorage.setItem(prdStorageKey, next);
    } catch (error) {}
    cancelPrdEdit();
    renderPrd();
  }
  function syncProductLinks(review) {
    document.querySelectorAll('[data-product-href]').forEach(link => {
      link.href = link.dataset.productHref + (review ? '?mode=review' : '');
    });
  }
  function reviewMode(next) {
    const review = next === 'review';
    $('review-panel').classList.toggle('open', review);
    document.querySelectorAll('#review-toggle button').forEach(button => button.classList.toggle('active', button.dataset.mode === next));
    syncProductLinks(review);
    if (review) renderPrd();
  }
  $('review-toggle').onclick = event => { const button = event.target.closest('[data-mode]'); if (button) reviewMode(button.dataset.mode); };
  $('review-editbar').onclick = event => {
    const button = event.target.closest('[data-prd-action]');
    if (!button) return;
    const action = button.dataset.prdAction;
    if (action === 'edit') editPrd();
    else if (action === 'save') savePrd();
    else if (action === 'cancel') cancelPrdEdit();
    else if (action === 'reset') {
      try { localStorage.removeItem(prdStorageKey); } catch (error) {}
      renderPrd();
    } else if (action === 'copy') {
      navigator.clipboard.writeText($('review-editor').value).then(() => {
        button.textContent = '已复制';
        setTimeout(() => { button.textContent = '复制 Markdown'; }, 1200);
      }).catch(() => {});
    }
  };
  $('close-review').onclick = () => { cancelPrdEdit(); reviewMode('demo'); };
  render('code');
  syncProductLinks(false);
  if (new URLSearchParams(location.search).get('mode') === 'review') reviewMode('review');
})();
</script>
</body>
</html>
